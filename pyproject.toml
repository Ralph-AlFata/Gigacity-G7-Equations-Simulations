[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpamayo-horizon-pipeline"
version = "0.1.0"
description = "Offline, conditional clearance-horizon experiments on PhysicalAI AV labels"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.12", "matplotlib>=3.8"]

[project.optional-dependencies]
dataset = ["physical_ai_av>=0.2.3", "pyarrow>=15", "huggingface_hub>=0.28"]

[project.scripts]
horizonlab = "horizonlab.cli:main"

[tool.setuptools.packages.find]
include = ["horizonlab*"]
