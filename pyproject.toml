[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpamayo-horizon-pipeline"
version = "0.2.0"
description = "Clearance-horizon experiments on PhysicalAI-AV clips with Alpamayo trajectories"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "huggingface_hub>=0.28",
    "physical_ai_av>=0.2.3",
]

[project.scripts]
horizon-fetch = "horizon_pipeline.raw.cli:main"
horizon-catalog = "horizon_pipeline.raw.catalog_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["horizon_pipeline*"]

[tool.setuptools.package-data]
"horizon_pipeline.raw" = ["presets.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
